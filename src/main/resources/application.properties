spring.application.name=TaskCopilot

# ---------- Web ----------
server.address=0.0.0.0
server.port=8080
spring.threads.virtual.enabled=true

# ---------- H2 ----------
spring.datasource.url=jdbc:h2:file:./data/taskcopilot;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Jackson ----------
# Jackson 3 默认即以 ISO-8601 输出时间，无需额外配置
spring.jackson.default-property-inclusion=always

# ---------- TaskCopilot ----------
taskcopilot.display-name=USER
taskcopilot.default-timeout-seconds=60
taskcopilot.max-concurrent-executions=5
taskcopilot.max-output-chars=20000
taskcopilot.log-retention-per-task=200
taskcopilot.auto-start=true

# ---------- Logging ----------
logging.level.io.github.haimfeng.taskcopilot=INFO
